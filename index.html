<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elvir Ali — Creative Producer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root {
  --bg: #f4f1ec;
  --bg-alt: #ece8e0;
  --ink: #161616;
  --ink-soft: #5a5a5a;
  --rule: rgba(22, 22, 22, 0.14);
  --accent: #161616;
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --slate-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill-rule='evenodd' d='M7.6 6.6 L9 4.2 h6 L16.4 6.6 H20 a1.8 1.8 0 0 1 1.8 1.8 v9.4 a1.8 1.8 0 0 1 -1.8 1.8 H4 a1.8 1.8 0 0 1 -1.8 -1.8 V8.4 a1.8 1.8 0 0 1 1.8 -1.8 z M12 9.4 a3.8 3.8 0 1 0 0.01 0 z'/></svg>");
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
  overflow-x: clip;
}

a { color: inherit; text-decoration: none; }

/* ── NAV ──────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 32px;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(8px);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.nav-links { display: flex; gap: 28px; }
.nav-link {
  position: relative;
  padding: 4px 0;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.nav-link:hover { opacity: 1; }
.nav-link.active { opacity: 1; }
.nav-link.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 1px; background: var(--ink);
}

/* ── HERO ─────────────────────────────────────────── */
.hero {
  padding: 96px 32px 56px;
  border-bottom: 1px solid var(--rule);
}
.hero-inner {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 48px;
}
.hero-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-tag::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink); display: inline-block;
}
.hero-title {
  font-family: var(--sans);
  font-weight: 400;
  font-size: clamp(40px, 5.6vw, 88px);
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 0;
  max-width: 18ch;
}
.hero-title em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  font-size: 0.92em;
}
.hero-meta {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  margin-top: 32px;
  align-items: start;
}
.hero-bio {
  grid-column: 1 / span 6;
  font-size: 17px;
  line-height: 1.5;
  max-width: 52ch;
  color: var(--ink);
}
.hero-side {
  grid-column: 9 / span 4;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.hero-side b { color: var(--ink); font-weight: 500; }

/* ── HERO + MAP LAYOUT ────────────────────────────── */
.hero-grid {
  grid-template-columns: minmax(0, 0.56fr) minmax(0, 1.44fr);
  gap: clamp(20px, 2vw, 36px);
  align-items: center;
}
.hero-lead { min-width: 0; }

.hero-locs { margin-top: clamp(28px, 3.4vw, 44px); max-width: 48ch; }
.hero-locs-head {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 9px;
}
.hero-locs-head::before {
  content: "";
  width: 13px; height: 12px; flex: none;
  background: var(--ink);
  -webkit-mask: var(--slate-mask) center / contain no-repeat;
          mask: var(--slate-mask) center / contain no-repeat;
}
.hero-locs-list {
  margin: 13px 0 0;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 2;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.hero-locs-list b { color: var(--ink); font-weight: 500; }

/* dotted world map */
.hero-map {
  position: relative;
  width: 100%;
  overflow: visible;
  color: var(--ink);
}
.fm-dots { width: 100%; height: auto; display: block; }
.fm-dots circle { fill: var(--ink); opacity: 0.32; }
.fm-arc {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.4;
  stroke-linecap: round;
  opacity: 0.38;
}

/* film-slate markers */
.fm-marker {
  position: absolute;
  width: 0; height: 0;
  z-index: 2;
}
.fm-marker .fm-slate {
  position: absolute;
  left: 0; top: 0;
  width: 18px; height: 18px;
  transform: translate(-50%, -100%);
  transform-origin: 50% 100%;
  color: var(--ink);
  opacity: 1;
  filter: drop-shadow(0 0 1.4px var(--bg)) drop-shadow(0 1px 1.4px rgba(22,22,22,.25));
  transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
  cursor: default;
}
.fm-marker .fm-slate svg { width: 100%; height: 100%; display: block; }
.fm-marker .fm-label {
  position: absolute;
  left: 12px; top: -19px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  pointer-events: none;
}
.fm-marker.left .fm-label { left: auto; right: 12px; }
.fm-marker:hover { z-index: 30; }
.fm-marker:hover .fm-slate {
  transform: translate(-50%, -100%) scale(1.22);
}
@keyframes fmPop {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .fm-marker .fm-slate { animation: none; }
}

/* ── MARQUEE ──────────────────────────────────────── */
.marquee {
  overflow: hidden;
  border-bottom: 1px solid var(--rule);
  padding: 22px 0;
  white-space: nowrap;
  background: var(--bg);
}
.marquee-track {
  display: inline-flex;
  gap: 48px;
  animation: marquee 28s linear infinite;
  font-family: var(--sans);
  font-size: clamp(28px, 5vw, 56px);
  letter-spacing: -0.02em;
}
.marquee-track span { display: inline-flex; align-items: center; gap: 48px; }
.marquee-track span::after {
  content: "";
  display: inline-block;
  width: 0.55em;
  height: 0.55em;
  background-color: currentColor;
  /* asterisk-burst mark, 8 thin rays */
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g stroke='black' stroke-width='1.6' stroke-linecap='round'><line x1='12' y1='2' x2='12' y2='22'/><line x1='2' y1='12' x2='22' y2='12'/><line x1='4.9' y1='4.9' x2='19.1' y2='19.1'/><line x1='19.1' y1='4.9' x2='4.9' y2='19.1'/></g></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g stroke='black' stroke-width='1.6' stroke-linecap='round'><line x1='12' y1='2' x2='12' y2='22'/><line x1='2' y1='12' x2='22' y2='12'/><line x1='4.9' y1='4.9' x2='19.1' y2='19.1'/><line x1='19.1' y1='4.9' x2='4.9' y2='19.1'/></g></svg>") center / contain no-repeat;
  opacity: 0.75;
  transform: translateY(-0.04em);
  animation: markSpin 8s linear infinite;
}
@keyframes markSpin {
  to { transform: translateY(-0.04em) rotate(360deg); }
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ── SECTION CAPS ─────────────────────────────────── */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 56px 32px 24px;
  max-width: 1440px;
  margin: 0 auto;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.section-head .index { color: var(--ink); }

/* ── PROJECT GRID ─────────────────────────────────── */
.work {
  padding: 0 32px 80px;
  max-width: 1440px;
  margin: 0 auto;
}
.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 24px;
  row-gap: 64px;
}

/* Mixed staggered: 1/2, 1/2, 1/3, 1/3, 1/3, 2/3-centered */
.grid[data-layout="mixed"] .card[data-i="0"] { grid-column: 1 / span 3; }
.grid[data-layout="mixed"] .card[data-i="1"] { grid-column: 4 / span 3; margin-top: 80px; }
.grid[data-layout="mixed"] .card[data-i="2"] { grid-column: 1 / span 2; }
.grid[data-layout="mixed"] .card[data-i="3"] { grid-column: 3 / span 2; margin-top: 48px; }
.grid[data-layout="mixed"] .card[data-i="4"] { grid-column: 5 / span 2; }
.grid[data-layout="mixed"] .card[data-i="5"] { grid-column: 2 / span 4; }

.grid[data-layout="two"] .card { grid-column: span 3; }
.grid[data-layout="three"] .card { grid-column: span 2; }

/* ── CARD ─────────────────────────────────────────── */
.card {
  display: block;
  cursor: pointer;
  position: relative;
}
.card-media {
  position: relative;
  overflow: hidden;
  background: var(--bg-alt);
  aspect-ratio: 4 / 5;
}
.grid[data-layout="mixed"] .card[data-i="0"] .card-media,
.grid[data-layout="mixed"] .card[data-i="1"] .card-media,
.grid[data-layout="mixed"] .card[data-i="5"] .card-media {
  aspect-ratio: 16 / 10;
}
.grid[data-layout="three"] .card-media { aspect-ratio: 1 / 1; }
.grid[data-layout="two"] .card-media { aspect-ratio: 16 / 8.5; }

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.5s;
}

/* Black overlay tint so the client logo reads cleanly */
.card-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.32);
  pointer-events: none;
  transition: background 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.card:hover .card-media::after { background: rgba(0, 0, 0, 0.42); }

/* Centered semi-transparent client logo overlay on each cover */
.card-client-logo {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  padding: 8%;
  z-index: 3;
  transition: opacity 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.card-client-logo img {
  max-width: 80%;
  max-height: 58%;
  object-fit: contain;
  opacity: 0.96;
  transform: scale(var(--logo-scale, 1));
  filter: drop-shadow(0 2px 24px rgba(0, 0, 0, 0.5));
  transition: opacity 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.card-client-logo.is-white img {
  filter: brightness(0) invert(1) drop-shadow(0 2px 24px rgba(0, 0, 0, 0.5));
}
.card:hover .card-client-logo img { opacity: 1; transform: scale(calc(var(--logo-scale, 1) * 1.03)); }

/* Hover variants */
.card[data-hover="zoom"]:hover .card-img { transform: scale(1.04); }
.card[data-hover="zoom"] .card-overlay { display: none; }

.card[data-hover="reveal"] .card-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 16px;
  background: linear-gradient(to top, rgba(22,22,22,0.55), rgba(22,22,22,0) 60%);
  opacity: 0; transition: opacity 0.35s;
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.card[data-hover="reveal"]:hover .card-overlay { opacity: 1; }
.card[data-hover="reveal"]:hover .card-img { transform: scale(1.02); }

.card[data-hover="none"] .card-overlay { display: none; }

.card-caption {
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.card-caption-left { min-width: 0; }
.card-role {
  display: block;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.card-meta { padding-top: 3px; }
.card-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0;
}
.card-title em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 1.05em;
  letter-spacing: 0;
  color: var(--ink-soft);
}
.card-meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
}

/* When type style is serif, hero & card titles use serif */
body[data-type="serif"] .hero-title { font-family: var(--serif); font-style: italic; letter-spacing: -0.02em; line-height: 0.95; }
body[data-type="serif"] .hero-title em { font-family: var(--sans); font-style: normal; }
body[data-type="serif"] .card-title { font-family: var(--serif); font-style: italic; font-size: 19px; letter-spacing: 0; font-weight: 400; }

/* ── ABOUT ────────────────────────────────────────── */
.about {
  border-top: 1px solid var(--rule);
  background: var(--bg);
  padding: 80px 32px;
}
.about-inner {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 32px;
}
.about-portrait {
  grid-column: 1 / span 4;
  aspect-ratio: 4 / 5;
  background: var(--bg-alt);
  overflow: hidden;
  position: relative;
}
.about-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(0.15); }
.about-body { grid-column: 6 / span 6; padding-top: 24px; }
.about-eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 16px;
}
.about-headline {
  font-family: var(--sans);
  font-size: clamp(28px, 3.4vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 400;
  margin: 0 0 28px;
}
.about-headline em { font-family: var(--serif); font-style: italic; }
.about-text { font-size: 16px; line-height: 1.55; max-width: 56ch; }
.about-text p { margin: 0 0 14px; }
.about-text p.muted { color: var(--ink-soft); }

/* Clients */
.clients {
  border-top: 1px solid var(--rule);
  padding: 48px 32px;
  max-width: 1440px;
  margin: 0 auto;
}
.clients-head {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 28px;
}
.clients-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px 32px;
}
.client {
  font-family: var(--sans);
  font-size: 22px;
  letter-spacing: -0.01em;
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 10px;
}
.client::before {
  content: "";
  width: 5px; height: 5px;
  background: var(--ink);
  border-radius: 50%;
  display: inline-block;
}

/* ── CONTACT / FOOTER ─────────────────────────────── */
.contact {
  border-top: 1px solid var(--rule);
  padding: 120px 32px 48px;
}
.contact-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 0.72fr 1fr;
  gap: clamp(40px, 6vw, 88px);
  align-items: center;
}
.contact-portrait {
  margin: 0;
  align-self: stretch;
  border: 1px solid var(--ink);
  padding: 10px;
  background: var(--bg);
}
.contact-portrait img {
  width: 100%;
  height: 100%;
  min-height: 420px;
  object-fit: cover;
  object-position: center 20%;
  display: block;
  filter: grayscale(1) contrast(1.02);
}
.contact-body { min-width: 0; }
.contact-label {
  display: block; text-align: center;
  font-family: var(--mono); font-size: 15px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink);
  margin-bottom: 48px;
}
.contact-lead { margin: 0; }
.contact-head {
  font-family: var(--sans); font-weight: 400;
  font-size: clamp(34px, 4.4vw, 60px); line-height: 1.0;
  letter-spacing: -0.03em; margin: 0; max-width: 12ch;
}
.contact-head em { font-family: var(--serif); font-style: italic; }
.contact-list {
  display: flex; flex-direction: column;
}
.contact-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 24px; padding: 20px 2px;
  border-top: 1px solid var(--rule);
  transition: padding-left 0.45s cubic-bezier(0.2,0.7,0.2,1);
}
.contact-row:last-child { border-bottom: 1px solid var(--rule); }
.contact-row .cr-k {
  flex: none;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft);
}
.contact-row .cr-v {
  font-family: var(--mono); font-style: normal; font-weight: 500;
  font-size: clamp(15px, 1.4vw, 19px); letter-spacing: 0.01em; text-align: right;
  text-transform: none; white-space: nowrap;
  color: var(--ink); line-height: 1;
  background: linear-gradient(currentColor, currentColor) 0 100%/0 1px no-repeat;
  transition: background-size 0.45s cubic-bezier(0.2,0.7,0.2,1);
}
.contact-row:hover { padding-left: 12px; }
.contact-row:hover .cr-v { background-size: 100% 1px; }
.contact-foot {
  display: flex; justify-content: space-between;
  margin-top: 56px; padding-top: 24px;
  border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-soft);
}

/* ── MOBILE ───────────────────────────────────────── */
@media (max-width: 860px) {
  .nav { padding: 14px 20px; }
  .hero { padding: 56px 20px 40px; }
  .hero-grid { grid-template-columns: 1fr; gap: 36px; }
  .hero-map { order: 2; max-width: 600px; }
  .hero-meta { grid-template-columns: 1fr; gap: 24px; }
  .hero-bio, .hero-side { grid-column: 1; }
  .work, .section-head, .about, .clients, .contact { padding-left: 20px; padding-right: 20px; }
  .grid { grid-template-columns: repeat(2, 1fr); row-gap: 40px; gap: 16px; }
  .grid[data-layout] .card { grid-column: span 1 !important; margin-top: 0 !important; }
  .grid[data-layout] .card .card-media { aspect-ratio: 4/5 !important; }
  /* Narrow mobile cards can't fit large logo scales — cap so wide
     wordmarks (e.g. Activision) don't overflow and get clipped. */
  .card-client-logo img { transform: scale(min(var(--logo-scale, 1), 1.15)); }
  .card:hover .card-client-logo img { transform: scale(min(var(--logo-scale, 1), 1.15)); }
  .about-inner { grid-template-columns: 1fr; }

            :                           "wm-text";
  return (
    <div className="ph-logo" aria-hidden="true">
      <svg viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet">
        <text x="300" y="130" textAnchor="middle"
              className={cls}

          {logo.main}
        </text>
        {logo.sub ? (

                className="wm-sub"
                style={{ fontSize: 16 }}>
            {logo.sub}
          </text>
        ) : null}
      </svg>
    </div>
  );
}

// Renders each card into the existing #projectGrid element so the grid CSS keeps its ordering rules.
function CardPortal({ p, index, hover }) {
  const grid = document.getElementById("projectGrid");
  const [node] = useState(() => {
    const el = document.createElement("div");
    el.style.display = "contents";
    return el;
  });
  useEffect(() => {
    if (!grid) return;
    grid.appendChild(node);
    return () => { try { grid.removeChild(node); } catch (e) {} };
  }, [grid, node]);
  return ReactDOM.createPortal(<ProjectCard p={p} index={index} hover={hover} />, node);
}

  function Y(lat) { return (LAT0 - lat) / (LAT0 - LAT1) * H; }
  function px(lon) { return (lon - LON0) / (LON1 - LON0) * 100; }

  // Stylised continent outlines [lon,lat]
  var POLYS = [

    /* Madagascar */ [[43,-13],[50,-16],[48,-25],[44,-22]],
    /* Europe */ [[-10,36],[-9,44],[-2,49],[2,51],[-5,58],[10,59],[12,64],[28,66],[40,64],[40,50],[28,45],[24,40],[20,42],[14,44],[3,43],[-2,36]],

  function pip(lon, lat, poly) {
    var inside = false, j = poly.length - 1;
    for (var i = 0; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function land(lon, lat) {
    for (var k = 0; k < POLYS.length; k++) if (pip(lon, lat, POLYS[k])) return true;
    return false;
  }

  var S = 1.7, dots = "";
  for (var lat = LAT0; lat >= LAT1; lat -= S) {

  }
  var svg = '<svg class="fm-dots" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + dots + '</svg>';

  var markers = PLACES.map(function (c) {

  map.innerHTML = svg + markers;
})();
